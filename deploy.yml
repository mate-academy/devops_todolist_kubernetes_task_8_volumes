apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate
  namespace: todoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mate-app
  template:
    metadata:
      labels:
        app: mate-app
    spec:
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: todo-pvc
        - name: app-configs
          configMap:
            name: app-config
            defaultMode: 0644
        - name: app-secrets
          secret:
            secretName: app-secret
            defaultMode: 0400
      containers:
      - name: todo
        image: todo-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: SECRET_KEY
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: todo-data
          mountPath: "/app/data"
        - name: app-configs
          mountPath: "/app/configs"
          readOnly: true
        - name: app-secrets
          mountPath: "/app/secrets"
          readOnly: true