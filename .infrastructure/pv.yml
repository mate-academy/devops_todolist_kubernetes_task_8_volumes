apiVersion: v1
kind: PersistentVolume
metadata:
  name: todoapp-pv
  labels:
    type: local
spec:
  storageClassName: standard
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  hostPath:
    path: "/data/todoapp-data"
    type: DirectoryOrCreate