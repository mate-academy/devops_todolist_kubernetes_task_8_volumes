apiVersion: v1
kind: PersistentVolume
metadata:
  name: todoapp-pv
  labels:
    app: todoapp
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  storageClassName: standard
  hostPath:
    path: /data/todoapp
    type: DirectoryOrCreate
