apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-todoapp-data
  namespace: todoapp
spec:
  storageClassName: standard # Обязательно добавляем, чтобы совпало с PV
  volumeName: pv-todoapp-data
  accessModes:
    - ReadWriteMany # Должно совпадать с accessModes в PV
  resources:
    requests:
      storage: 1Gi # Указываем запрашиваемый объем (не больше, чем в PV)