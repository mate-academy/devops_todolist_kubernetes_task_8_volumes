apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-deployment
  namespace: mateapp
  labels:
    app: todolist
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
    spec:
      containers:
      - name: todoapp-container
        image: vitsheo/todoapp:3.0.0
        ports:
        - containerPort: 8000
        volumeMounts:
        # Монтуємо постійний диск для даних додатку
        - name: todoapp-storage
          mountPath: /app/data
        # Монтуємо ConfigMap як файли лише для читання
        - name: config-volume
          mountPath: /app/configs
          readOnly: true
        # Монтуємо Secret як файли лише для читання
        - name: secret-volume
          mountPath: /app/secrets
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: todoapp-storage
        persistentVolumeClaim:
          claimName: todoapp-pvc
      - name: config-volume
        configMap:
          name: todoapp-config
      - name: secret-volume
        secret:
          secretName: todoapp-secret
