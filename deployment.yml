apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
        - name: todo-container
          image: your-django-image:latest  # 🔁 заміни, якщо маєш свій образ
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: config-volume
              mountPath: /app/configs
              readOnly: true
            - name: secret-volume
              mountPath: /app/secrets
              readOnly: true
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "todolist.settings"
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: todo-pvc
        - name: config-volume
          configMap:
            name: todo-config
        - name: secret-volume
          secret:
            secretName: todo-secret
